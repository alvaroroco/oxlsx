[package]
name = "oxlsx"
version = "0.1.1"
edition = "2024"
description = "A fast .xlsx reader/writer with an openpyxl-style API, powered by Rust"
license = "MIT OR Apache-2.0"
repository = "https://github.com/alvaroroco/oxlsx"
authors = ["Álvaro Rodríguez <alvaroroco@proton.me>"]
readme = "README.md"
keywords = ["xlsx", "excel", "spreadsheet", "openpyxl", "ooxml"]
categories = ["parser-implementations", "encoding"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# `python` links a real interpreter (auto-initialize) so the in-crate PyO3
# unit tests can run under `cargo test --features python`. It must NOT enable
# `extension-module`, which would unlink libpython and break those tests.
python = ["dep:pyo3", "pyo3/auto-initialize"]
# `extension-module` is the wheel-build path: PyO3 does not link libpython and
# the abi3 (py38 floor) stable ABI is enabled so a single wheel covers
# CPython 3.8+. maturin selects this feature (see [tool.maturin] in
# pyproject.toml). `auto-initialize` and `extension-module` are mutually
# exclusive, so they are split across these two features and never co-active.
extension-module = ["dep:pyo3", "pyo3/extension-module", "pyo3/abi3-py38"]

[dependencies]
quick-xml = "0.36"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
thiserror = "1.0"
chrono = { version = "0.4", default-features = false, features = ["std"] }
pyo3 = { version = "0.22", optional = true }
tempfile = "3"
indexmap = "2"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "read_benchmarks"
harness = false

[[bench]]
name = "write_benchmarks"
harness = false
