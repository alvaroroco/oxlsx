name: Benchmarks

on:
  pull_request:
    branches: [main]

jobs:
  benchmark:
    name: Run criterion benchmarks
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-bench-

      - name: Install critcmp
        run: cargo install critcmp --quiet

      # Run benchmarks on the PR branch and save results
      - name: Run benchmarks (PR branch)
        run: cargo bench -- --save-baseline pr

      # Checkout main and run benchmarks for comparison
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          clean: false

      - name: Run benchmarks (main branch)
        run: cargo bench -- --save-baseline main

      # Compare and generate report
      - name: Compare benchmarks
        id: compare
        run: |
          echo "## Benchmark Results" > bench_report.md
          echo "" >> bench_report.md
          echo "Comparing PR branch vs \`main\`" >> bench_report.md
          echo "" >> bench_report.md
          echo "\`\`\`" >> bench_report.md
          critcmp main pr --threshold 2 >> bench_report.md 2>&1 || true
          echo "\`\`\`" >> bench_report.md
          echo "" >> bench_report.md
          echo "<details>" >> bench_report.md
          echo "<summary>Full results</summary>" >> bench_report.md
          echo "" >> bench_report.md
          echo "\`\`\`" >> bench_report.md
          critcmp main pr >> bench_report.md 2>&1 || true
          echo "\`\`\`" >> bench_report.md
          echo "</details>" >> bench_report.md

      - name: Post benchmark comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('bench_report.md', 'utf8');
            const body = report + '\n\n> Regressions > 2% are highlighted. Run locally: `cargo bench`';

            // Delete previous benchmark comment if exists
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            for (const comment of comments.data) {
              if (comment.body.includes('## Benchmark Results')) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: comment.id,
                });
              }
            }

            // Post new comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
