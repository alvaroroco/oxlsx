name: Benchmarks

on:
  pull_request:
    branches: [main]

jobs:
  benchmark:
    name: Run criterion benchmarks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-bench-

      # Run benchmarks on PR branch, save as JSON
      - name: Run benchmarks
        run: cargo bench -- --output-format bencher | tee bench_output.txt

      # Post results as PR comment
      - name: Post benchmark comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let output = '';
            try {
              output = fs.readFileSync('bench_output.txt', 'utf8');
            } catch (e) {
              output = 'No benchmark output found.';
            }

            const body = `## Benchmark Results\n\n\`\`\`\n${output}\n\`\`\`\n\n> Run locally: \`cargo bench\`\n> Compare vs openpyxl: \`python3 benches/openpyxl_comparison.py\``;

            // Delete previous benchmark comment if exists
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            for (const comment of comments.data) {
              if (comment.body.includes('## Benchmark Results')) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: comment.id,
                });
              }
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
